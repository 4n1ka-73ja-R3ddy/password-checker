apiVersion: apps/v1
kind: Deployment
metadata:
  name: password-checker
  labels:
    app: password-checker
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: password-checker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: password-checker
        tier: backend
    spec:
      containers:
        - name: password-checker
          image: password-checker:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Chosen Deployment Enhancement: Kubernetes Health Probes
          # Readiness Probe: ensures traffic is routed only after Spring Boot has initialized
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness Probe: detects application deadlock/unresponsiveness and restarts pod
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

