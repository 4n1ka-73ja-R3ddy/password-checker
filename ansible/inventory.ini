# ==============================================================================
# Ansible Inventory: Target Server Configuration
# ==============================================================================

[app_servers]
# For running locally on this machine (WSL2 / local Linux):
app_host ansible_connection=local

# If deploying to a remote Linux VM / host via SSH instead, uncomment and configure:
# app_host ansible_host=<YOUR_TARGET_VM_IP> ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
