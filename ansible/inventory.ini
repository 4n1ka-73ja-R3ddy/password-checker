# ==============================================================================
# Ansible Inventory: Target Server Configuration
# ==============================================================================

[app_servers]
# Target Linux host (replace with your local Ubuntu VM / target host IP address):
app_host ansible_host=192.168.1.50 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

