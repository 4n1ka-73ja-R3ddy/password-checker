# Application Information
spring.application.name=password-checker
server.port=8080

# Security Boundaries:
# - Do not include stack traces or raw internal exception details in HTTP error responses
# - Prevent leaking sensitive request payload data
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Disable verbose request/response body logging
logging.level.org.springframework.web=INFO
logging.level.com.example.passwordchecker=INFO

# OpenAPI / Swagger UI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method

